<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" fill="none" width="360" height="380">
  <defs>
    <linearGradient id="eamGoldSt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D4" />
      <stop offset="35%" stop-color="#E2BE82" />
      <stop offset="70%" stop-color="#C59F54" />
      <stop offset="100%" stop-color="#967132" />
    </linearGradient>

    <linearGradient id="eamNavySt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4F7C" />
      <stop offset="50%" stop-color="#1A3459" />
      <stop offset="100%" stop-color="#0E213D" />
    </linearGradient>

    <linearGradient id="navyHighlightSt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A75AA" />
      <stop offset="100%" stop-color="#142A4A" />
    </linearGradient>
  </defs>

  <!-- Centered Emblem -->
  <g transform="translate(100, 15) scale(1.5)">
    <!-- Tower 1 (Left Navy) -->
    <polygon points="12,46 29,35 29,90 12,94" fill="url(#navyHighlightSt)" stroke="#6B93C4" stroke-width="0.75" />
    <!-- Tower 2 (Tallest Gold) -->
    <polygon points="34,16 52,4 52,86 34,88" fill="url(#eamGoldSt)" />
    <!-- Tower 3 (Mid-Tall Gold) -->
    <polygon points="57,28 73,42 73,88 57,86" fill="url(#eamGoldSt)" />
    <!-- Tower 4 (Right Navy) -->
    <polygon points="78,48 92,57 92,94 78,90" fill="url(#navyHighlightSt)" stroke="#6B93C4" stroke-width="0.75" />

    <!-- Swooshes -->
    <path d="M 0,93 Q 52,68 104,93 Q 52,76 0,93 Z" fill="url(#eamNavySt)" stroke="#4A75AA" stroke-width="0.6" />
    <path d="M 2,98 Q 28,88 48,93 L 42,98 Q 24,94 2,102 Z" fill="url(#eamNavySt)" />
    <path d="M 40,89 Q 55,86 70,91 L 64,96 Q 52,92 34,94 Z" fill="url(#eamGoldSt)" />
    <path d="M 18,103 Q 50,91 96,104 L 92,108 Q 50,97 14,107 Z" fill="url(#eamGoldSt)" />
    <path d="M 38,103 Q 58,95 90,103 L 86,107 Q 56,100 34,107 Z" fill="url(#eamGoldSt)" />
  </g>

  <!-- Centered E A M Text -->
  <g transform="translate(180, 260)" text-anchor="middle">
    <!-- E A M Letters -->
    <text x="-90" y="0" font-family="'Playfair Display', Georgia, serif" font-size="78" font-weight="700" fill="#E8EDF5" stroke="#1A3459" stroke-width="1.5">E</text>
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="78" font-weight="700" fill="url(#eamGoldSt)">A</text>
    <text x="90" y="0" font-family="'Playfair Display', Georgia, serif" font-size="78" font-weight="700" fill="#E8EDF5" stroke="#1A3459" stroke-width="1.5">M</text>

    <!-- Divider Line with Diamond -->
    <line x1="-155" y1="28" x2="-25" y2="28" stroke="url(#eamGoldSt)" stroke-width="1" />
    <polygon points="0,22 6,28 0,34 -6,28" fill="url(#eamGoldSt)" />
    <line x1="25" y1="28" x2="155" y2="28" stroke="url(#eamGoldSt)" stroke-width="1" />

    <!-- Subtitle -->
    <text x="0" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" letter-spacing="4" fill="url(#eamGoldSt)">REAL ESTATE &amp; HOSPITALITY INVESTMENT</text>
  </g>
</svg>
